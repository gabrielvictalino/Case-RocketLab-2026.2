name: Proteções da Silver de faturas
on:
  pull_request:
    paths:
      - 'data-engineering/**'
      - 'tests/test_publicacao_faturas.py'
      - '.github/workflows/faturas.yml'
  push:
    branches: [dev, main]
    paths:
      - 'data-engineering/**'
      - 'tests/test_publicacao_faturas.py'
      - '.github/workflows/faturas.yml'
permissions:
  contents: read
jobs:
  protecoes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_publicacao_faturas.py -v
