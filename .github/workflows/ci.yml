name: Aplicação
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
          enable-cache: true
      - run: uv sync --frozen --all-packages
      - run: uv run ruff check backend ai-agent importador contracts conftest.py
      - run: uv run ruff format --check backend ai-agent importador contracts conftest.py
      - run: uv run pytest -q
  ci:
    name: CI
    if: always()
    needs: [backend]
    runs-on: ubuntu-latest
    steps:
      - name: Conferir resultado
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
        run: test "$BACKEND_RESULT" = success
