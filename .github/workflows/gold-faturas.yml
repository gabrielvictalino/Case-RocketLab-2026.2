name: Gold de faturas
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
permissions:
  contents: read
jobs:
  gold-faturas:
    name: Gold de faturas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python -m pip install -r data-engineering/requirements-test.txt
      - run: python -m ruff check data-engineering/silver_to_gold data-engineering/tests
      - name: Testar regras de negócio com Spark
        env:
          SPARK_LOCAL_IP: 127.0.0.1
        run: python -m unittest discover -s data-engineering/tests -v
