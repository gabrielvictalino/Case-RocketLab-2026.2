[project]
name = "ai-agent"
description = "Módulo Agêntico do projeto V-Energy"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.11,<3",
    "pydantic-ai-slim[google,openai]>=2.64,<3",
    "sqlalchemy[asyncio]>=2.0.39,<2.1",
    "sqlglot>=30.23,<31",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/venergy_ai"]
