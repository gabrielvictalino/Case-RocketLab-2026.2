limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=ia:10m rate=2r/s;
limit_req_status 429;

server {
    listen 80;
    server_name _;

    server_tokens off;
    client_max_body_size 10m;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types
        application/javascript
        text/javascript
        text/css
        application/json
        image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    error_page 429 @limitado;

    location @limitado {
        default_type application/json;
        add_header Retry-After 1 always;
        add_header X-Request-ID $request_id always;
        return 429 '{"detail":"Muitas requisições. Tente novamente em instantes.","code":"limite_requisicoes"}';
    }

    location /api/v1/assistente/ {
        limit_req zone=ia burst=5 nodelay;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    location /api/v1/insights/ {
        limit_req zone=ia burst=5 nodelay;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    location /api/v1/ {
        limit_req zone=api burst=40 nodelay;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    location /api/ {
        default_type application/json;
        add_header X-Request-ID $request_id always;
        return 404 '{"detail":"Rota não encontrada","code":"nao_encontrado"}';
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }

    location / {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
