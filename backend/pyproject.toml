[project]
name = "backend"
description = "Módulo Backend do projeto V-Energy"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "ai-agent",
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.0",
    "pydantic>=2.14.1",
    "sqlalchemy>=2.1.6",
    "uvicorn>=0.54.0",
]

[tool.uv.sources]
ai-agent = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
