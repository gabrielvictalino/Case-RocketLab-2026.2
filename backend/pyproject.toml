[project]
name = "backend"
description = "Módulo Backend do projeto V-Energy"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ai-agent",
    "alembic>=1.15,<2",
    "asyncpg>=0.30,<1",
    "fastapi>=0.121,<1",
    "pydantic-settings>=2.8,<3",
    "sqlalchemy>=2.0.39,<2.1",
    "uvicorn>=0.34,<1",
    "redis>=5.2,<7",
    "PyJWT>=2.10,<3",
    "pwdlib[argon2]>=0.2,<1",
]

[tool.uv.sources]
ai-agent = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
