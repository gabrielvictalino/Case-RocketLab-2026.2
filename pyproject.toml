[project]
name = "case-rocketlab-2026-2"
version = "0.1.0"
description = "Projeto V-Energy do case RocketLab 2026.2"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.uv.workspace]
members = ["backend", "ai-agent", "importador"]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.25,<2",
    "httpx>=0.28,<1",
    "testcontainers[postgres,redis]>=4.10,<5",
    "psycopg[binary]>=3.2,<4",
    "ruff>=0.11,<1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
quote-style = "single"
docstring-code-format = true

[tool.ruff.lint]
select = ["E", "F"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["backend/tests", "ai-agent/tests", "importador/tests", "tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = ["integration: PostgreSQL 17 e Redis 7 reais via Testcontainers"]
