version: 0.3.0-provisional
status: provisorio-nao-aprovado
table: dim_alimentador
grain: alimentador
primary_key:
- alimentador
columns:
  alimentador:
    type: text
    nullable: false
    unit: —
    pattern: ^ALM-[A-Z]{3}-\d{3}$
    description: Código identificador único do alimentador de distribuição.
  municipio:
    type: text
    nullable: false
    unit: —
    description: Município das UCs do alimentador (único; a Gold bloqueia alimentador com UCs em mais de um município).
  numero_ucs:
    type: integer
    nullable: false
    unit: UCs
    minimum: 1
    description: Número de unidades consumidoras vinculadas ao alimentador.
description: Dimensão cadastral dos alimentadores de distribuição de energia elétrica.
control_totals: []
