version: 0.3.0-provisional
status: provisorio-nao-aprovado
table: ocorrencias_uc
grain: ocorrência por UC
primary_key:
- id_ocorrencia
columns:
  id_ocorrencia:
    type: text
    nullable: false
    unit: —
    pattern: ^OC\d{8}$
    description: Código identificador único da ocorrência ou evento de interrupção.
  id_uc:
    type: text
    nullable: false
    unit: —
    pattern: ^UC\d{6}$
    references:
    - dim_uc
    - id_uc
    description: Identificador da unidade consumidora afetada pela interrupção.
  alimentador:
    type: text
    nullable: false
    unit: —
    pattern: ^ALM-[A-Z]{3}-\d{3}$
    references:
    - dim_alimentador
    - alimentador
    description: Alimentador associado ao circuito onde a interrupção ocorreu.
  data_abertura:
    type: timestamp
    nullable: false
    unit: —
    description: Data e hora de início da interrupção do fornecimento.
  data_encerramento:
    type: timestamp
    nullable: false
    unit: —
    description: Data e hora de restabelecimento do fornecimento.
  duracao_min:
    type: numeric(18,2)
    nullable: false
    unit: min
    minimum: 0
    description: Duração total da ocorrência calculada em minutos.
  duracao_efetiva_min:
    type: numeric(18,2)
    nullable: false
    unit: min
    minimum: 0
    description: Duração efetiva expurgada de sobreposições em minutos.
  causa:
    type: text
    nullable: false
    unit: —
    description: Causa apurada da interrupção na rede elétrica.
  flag_sobreposicao:
    type: boolean
    nullable: false
    unit: —
    description: Indica se o evento ocorreu em concomitância com outra interrupção no mesmo ponto.
description: Registro individualizado das interrupções de fornecimento de energia percebidas por unidade consumidora.
control_totals:
- duracao_min
- duracao_efetiva_min
