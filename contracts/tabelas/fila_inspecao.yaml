version: 0.3.0-provisional
status: provisorio-nao-aprovado
table: fila_inspecao
grain: UC candidata
primary_key:
- id_uc
columns:
  id_uc:
    type: text
    nullable: false
    unit: —
    pattern: ^UC\d{6}$
    references:
    - dim_uc
    - id_uc
    description: Identificador da unidade consumidora selecionada para inspeção.
  score:
    type: numeric(18,2)
    nullable: false
    unit: —
    minimum: 0
    description: Pontuação de propensão à fraude estimada pelos modelos analíticos da Gold.
  motivos:
    type: jsonb
    nullable: false
    unit: —
    description: Lista de motivos e anomalias estatísticas que justificaram a inclusão na fila.
  energia_recuperar_kwh:
    type: numeric(18,2)
    nullable: false
    unit: kWh
    minimum: 0
    description: Volume de energia estimado a recuperar caso a irregularidade seja confirmada.
  energia_recuperar_reais:
    type: numeric(18,2)
    nullable: false
    unit: R$
    minimum: 0
    description: Valor financeiro estimado a recuperar em reais.
description: Fila priorizada de unidades consumidoras suspeitas de fraude ou irregularidade para inspeção em campo.
control_totals:
- energia_recuperar_kwh
- energia_recuperar_reais
