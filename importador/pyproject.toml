[project]
name = "importador"
description = "Módulo de Importação do projeto V-Energy"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["asyncpg>=0.30,<1", "redis>=5.2,<7", "PyYAML>=6,<7", "jsonschema>=4.23,<5", "python-dotenv>=1,<2"]

[project.scripts]
importador = "importador.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/importador"]
